<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <defs>
        <linearGradient id="purpleIrisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c084fc" />
            <stop offset="45%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#5b4f96" />
        </linearGradient>
        <linearGradient id="accentIrisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a78bfa" />
            <stop offset="55%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#4338ca" />
        </linearGradient>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#18132b" />
            <stop offset="100%" stop-color="#090d16" />
        </linearGradient>
        <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Squircle Tile -->
    <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#purpleIrisGrad)" stroke-width="2.5" />

    <!-- Ambient Glow Disc -->
    <circle cx="50" cy="50" r="28" fill="#6366f1" opacity="0.22" filter="url(#purpleGlow)" />

    <!-- Acoustic Book & Soundwave 'M' Emblem -->
    <!-- Left Book Page / Wave -->
    <path d="M 28 32 C 34 30, 42 34, 46 38 L 46 68 C 42 64, 34 62, 28 64 Z" fill="url(#purpleIrisGrad)" opacity="0.9" />
    <!-- Right Book Page / Wave -->
    <path d="M 72 32 C 66 30, 58 34, 54 38 L 54 68 C 58 64, 66 62, 72 64 Z" fill="url(#accentIrisGrad)" opacity="0.9" />

    <!-- Center Spine & Broadcast Soundwave Bars -->
    <rect x="48.5" y="36" width="3" height="34" rx="1.5" fill="#ffffff" filter="url(#purpleGlow)" />

    <!-- Broadcast Soundwave Arcs -->
    <path d="M 22 42 C 18 46, 18 54, 22 58" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
    <path d="M 78 42 C 82 46, 82 54, 78 58" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />

    <path d="M 15 36 C 9 43, 9 57, 15 64" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 85 36 C 91 43, 91 57, 85 64" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

    <!-- Top Broadcast Beacon -->
    <circle cx="50" cy="27" r="3.2" fill="#c084fc" filter="url(#purpleGlow)" />
</svg>
