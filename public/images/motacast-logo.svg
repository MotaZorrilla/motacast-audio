<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
    <defs>
        <linearGradient id="cyberGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="50%" stop-color="#00ff87" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="bgGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0e171b" />
            <stop offset="100%" stop-color="#05090b" />
        </linearGradient>
        <filter id="neonGlowLogo" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Icon Squircle Group -->
    <g transform="translate(6, 6)">
        <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#bgGradLogo)" stroke="url(#cyberGradLogo)" stroke-width="2" />
        <circle cx="26" cy="26" r="14" fill="#00ff87" opacity="0.12" filter="url(#neonGlowLogo)" />
        <path d="M 14 18 C 17 17, 21 19, 23 21 L 23 37 C 21 35, 17 34, 14 35 Z" fill="url(#cyberGradLogo)" opacity="0.9" />
        <path d="M 38 18 C 35 17, 31 19, 29 21 L 29 37 C 31 35, 35 34, 38 35 Z" fill="url(#cyberGradLogo)" opacity="0.9" />
        <rect x="25" y="19" width="2" height="19" rx="1" fill="#ffffff" />
        <path d="M 10 23 C 8 25, 8 29, 10 31" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
        <path d="M 42 23 C 44 25, 44 29, 42 31" stroke="#00ff87" stroke-width="2" stroke-linecap="round" />
        <circle cx="26" cy="14" r="2" fill="#00f0ff" />
    </g>

    <!-- Typography -->
    <text x="72" y="37" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="currentColor">
        MotaCast<tspan fill="url(#cyberGradLogo)" font-weight="900">Audio</tspan>
    </text>
    <text x="73" y="49" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.5" fill="#64748b">
        STREAMING &amp; AUDIOLIBROS
    </text>
</svg>
