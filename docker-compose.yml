services:
  mariadb:
    image: mariadb:11.4
    container_name: audiolibros-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-RootSecretAudioLab2026!}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-audiolibros}
      - MARIADB_USER=${MARIADB_USER:-audiolibros}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-SecureAudioLab2026!}
    volumes:
      - audiolibros_mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - audiolibros-net

  app:
    build: .
    image: audiolibros-img
    container_name: audiolibros-app
    restart: unless-stopped
    environment:
      - PHP_CLI_SERVER_WORKERS=4
    mem_limit: 900m
    cpus: 0.90
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "ffmpeg -version >/dev/null 2>&1 && python3 -c 'import speech_recognition, edge_tts' >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
    ports:
      - "8096:8000"
    volumes:
      - .:/app
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
    depends_on:
      - mariadb
    networks:
      - audiolibros-net

volumes:
  audiolibros_mariadb_data:
    name: audiolibros_mariadb_data

networks:
  audiolibros-net:
    name: audiolibros-net
    driver: bridge
